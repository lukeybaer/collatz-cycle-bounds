name: Verify research evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify frozen hashes and reproduce seven audits
        run: python scripts/verify_revision.py --audits
      - name: Regenerate direct-iteration, native arithmetic and exact interval checks
        run: python scripts/verify_revision.py --small-tests
      - name: Replay full-reference revision receipts when present
        shell: pwsh
        run: |
          if (Test-Path evidence/revision-20261002/cycle-exclusion-m100-fourth-power-grafted-audit.json) {
            python scripts/verify_revision.py --m100
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build every legacy module and the connected root with bounded memory
        run: python3 scripts/build_lean.py
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          working_directory: paper
          root_file: collatz-research-paper.tex
          texlive_version: 2026
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collatz-paper
          path: |
            paper/collatz-research-paper.pdf
            paper/collatz-research-paper.log
          if-no-files-found: error
